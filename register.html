<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - PocketSmart AI</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="container auth-container">
        <div class="card">
            <p class="eyebrow">POCKETSMART</p>
            <h1 class="form-title">Create your account</h1>
            <p class="form-intro">Your plans, organized around the budget you set.</p>
            {% if error == "username" %}
            <p class="form-alert" role="alert">That username is already registered. <a href="/login">Sign in</a> or choose another username.</p>
            {% endif %}
            <form action="/register" method="POST">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" required autocomplete="username" placeholder="Choose a username">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" required autocomplete="email" placeholder="Enter your email">
                <label for="full_name">Full name <span class="optional-label">Optional</span></label>
                <input id="full_name" type="text" name="full_name" autocomplete="name" placeholder="Enter your full name">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" required autocomplete="new-password" placeholder="Create a strong password">
                <button type="submit" class="btn btn-block">Create account</button>
            </form>
            <p class="form-footer">Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </main>
</body>
</html>
